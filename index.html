<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1030">
    <title>ユメクイ（仮題）</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <main id="app">
        <div id="screen">
            <canvas id="game" width="320" height="240"></canvas>
            <div id="hud" hidden>
                <div id="clock">
                    <div id="date"></div>
                    <div id="time"></div>
                    <div id="items"></div>
                </div>
                <span id="place"></span>
            </div>
            <div id="status" hidden>
                <div class="unit" id="foe-status"></div>
                <div class="unit" id="ally-status">
                    <div class="row"><span class="name"></span><span class="attr"></span><span class="num"></span></div>
                    <div class="bar hp"><i></i></div>
                </div>
            </div>
            <div id="title" hidden>
                <h1><img id="logo" src="./img/logo.png" alt="ユメクイ"></h1>
                <p>言えなかった気持ちを、言えるようになる話</p>
            </div>
            <img id="portrait-left" class="portrait" alt="" hidden>
            <img id="portrait-right" class="portrait" alt="" hidden>
            <img id="portrait-center" class="portrait" alt="" hidden>
            <img id="cutin" alt="" hidden>
            <img id="bigart" alt="" hidden>
            <div id="msg" hidden>
                <div id="speaker"></div>
                <div id="text"></div>
            </div>
            <div id="menu" hidden></div>
            <div id="grow" hidden></div>
            <div id="fade"></div>
        </div>
        <div id="pad">
            <div class="cross">
                <button data-key="up" aria-label="上">▲</button>
                <button data-key="left" aria-label="左">◀</button>
                <button data-key="right" aria-label="右">▶</button>
                <button data-key="down" aria-label="下">▼</button>
            </div>
            <div class="action">
                <button data-key="b" aria-label="もどる">B</button>
                <button data-key="a" aria-label="決定">A</button>
            </div>
        </div>
    </main>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
